// Zone transport layer - gRPC services and messages.
//
// This proto file defines the gRPC services and messages for:
// 1. ZoneTransportService - Internal node-to-node Raft consensus
// 2. ZoneApiService - Client-facing API for zone operations

syntax = "proto3";

package nexus.raft;

import "nexus/raft/commands.proto";

// === Services ===

// ZoneTransportService handles Raft consensus protocol messages.
//
// This service is used for communication between Raft nodes (leaders, followers, witnesses).
service ZoneTransportService {
  // StepMessage forwards a raw raft-rs eraftpb::Message between nodes.
  // The bytes are opaque to the transport layer — serialized using protobuf v2
  // (raft-rs's native format). This is the standard pattern (etcd, tikv) for
  // routing all raft-rs internal message types (~15 types) through a single RPC.
  rpc StepMessage(StepMessageRequest) returns (StepMessageResponse);

  // ReplicateEntries sends EC (eventually consistent) entries to a peer.
  // This is NOT Raft consensus — EC writes bypass Raft and use async replication.
  // Used by the background replication loop (Phase C) for peer data sync.
  // Entries are idempotent — receivers skip already-applied sequence numbers.
  rpc ReplicateEntries(ReplicateEntriesRequest) returns (ReplicateEntriesResponse);

  // SnapshotEcState transfers the sender's current EC state to a peer that
  // fell behind the compacted WAL region (`needs_snapshot`). Incremental
  // ReplicateEntries cannot serve it — the entries the peer missed were
  // already compacted away — so the sender re-materializes its CURRENT state
  // (as SetMetadata commands) and ships it. The receiver applies each
  // LWW-idempotently; after the batch its acked_seq jumps to `covering_seq`
  // and it resumes incremental replication from there. Still EC (bypasses
  // Raft consensus).
  rpc SnapshotEcState(SnapshotEcStateRequest) returns (SnapshotEcStateResponse);
}

// ZoneApiService provides the client-facing API for zone operations.
//
// This service is used by clients (Python, CLI, etc.) to interact with the Raft cluster.
// It differs from ZoneTransportService which is for internal node-to-node communication.
//
// Architecture:
// - Propose: Write operations -> goes through Raft log -> applied to state machine
// - Query: Read operations -> served directly from state machine (any node)
//
// Leader handling:
// - Propose: If not leader, returns leader address for client to redirect
// - Query: Can be served by any node (eventual consistency) or redirected to leader (strong consistency)
service ZoneApiService {
  // Propose submits a command to be replicated through Raft.
  // Only the leader can accept proposals; followers return a redirect.
  rpc Propose(ProposeRequest) returns (ProposeResponse);

  // Query reads from the local state machine without going through Raft.
  // Can be served by any node. Use read_from_leader=true for linearizable reads.
  rpc Query(QueryRequest) returns (QueryResponse);

  // GetClusterInfo returns information about the Raft cluster.
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);

  // JoinZone requests that this node add a new node to a zone's Raft group.
  // Must be sent to the leader; followers return a redirect with leader_address.
  // This is a one-time setup operation — after joining, the new node receives
  // a snapshot from the leader and becomes an equal Voter with a local sled replica.
  rpc JoinZone(JoinZoneRequest) returns (JoinZoneResponse);

  // DiscoverZones reports the responder's federation zone
  // topology — the `(zone_id, mount_path)` pairs the responder is
  // configured to expose to peers.  Read-only; no ConfState
  // mutation.  Used by S3 Phase D fresh-joiner boot to auto-
  // discover which zones to `JoinZone` against and where to mount
  // them locally, closing the "one command bring-up" ambition:
  // a joiner with only `--peers <founder>` no longer needs the
  // offline `nexusd-cluster join` sidecar for the initial join.
  //
  // Contract: served by any node, does not require leader.  The
  // list reflects the responder's *local* mount configuration —
  // typically populated at boot from `NEXUS_FEDERATION_MOUNTS` /
  // `NEXUS_FEDERATION_ZONES` on the founder, and left empty on
  // pure-joiner nodes.
  rpc DiscoverZones(DiscoverZonesRequest) returns (DiscoverZonesResponse);

  // RemoveVoter proposes a `RemoveNode` ConfChange against a zone —
  // wire mirror of `JoinZone` for the opposite direction.
  // Must be sent to the leader; followers return a redirect with
  // leader_address.  Straight pass-through to raft-rs's
  // `RawNode::propose_conf_change` — no transport bypass, no
  // Progress mutation, and no state-machine surgery.  raft-rs
  // rejects the "removed all voters" case at apply time, so this
  // RPC cannot brick the zone.  Cluster hygiene for a genuinely
  // dead node; see the CLI docstring for the operator flow.
  rpc RemoveVoter(RemoveVoterRequest) returns (RemoveVoterResponse);

  // DeleteZone removes this node's local replica for a zone.
  //
  // Internal maintenance RPC used by federation_remove_zone fan-out. This is
  // intentionally local-only: the caller coordinates peer fan-out, while the
  // receiver only shuts down its in-memory raft group and deletes its on-disk
  // replica. It is idempotent so retries and already-cleaned peers are safe.
  rpc DeleteZone(DeleteZoneRequest) returns (DeleteZoneResponse);

  // GetSearchCapabilities returns the search modes available on a zone (Issue #3147).
  // Used by FederatedSearchDispatcher to route queries to zones that can handle them.
  rpc GetSearchCapabilities(GetSearchCapabilitiesRequest) returns (SearchCapabilities);

  // ReadBlob serves a CAS blob by content hash — driver-to-driver protocol.
  // R20.18.7: inter-node only, co-located with ZoneApiService on the raft
  // port so it inherits the cluster's mTLS + join-token authentication.
  // Used by follower `try_remote_fetch` / scatter-gather chunk fetch when
  // metadata has been replicated ahead of content.
  rpc ReadBlob(ReadBlobRequest) returns (ReadBlobResponse);

  // MintAgent signs an agent identity cert (`nexus://agent/{subject_id}`) on the
  // CA holder (founder) for a caller on any cluster node — so an agent on a
  // joiner is provisioned without hand-carrying a private key. mTLS-gated to a
  // NODE peer (agents may not mint agents); a node that does not hold the CA
  // key returns success=false. Reuses the same generate + authz units as the
  // local `auth mint`, run against the founder's live CA + auth store.
  rpc MintAgent(MintAgentRequest) returns (MintAgentResponse);

  // MintKey mints an `sk-` user/service credential through the live daemon, so
  // `auth mint --subject-type user|service` just-works while the daemon holds
  // the store lock (no "stop the daemon first"). The daemon HMACs the key with
  // its cluster secret and writes the record via consensus (propose forwards to
  // the control-zone leader), so it works on any node. mTLS-gated to a NODE peer
  // (an admin op, never an agent). Returns the one-time plaintext key.
  rpc MintKey(MintKeyRequest) returns (MintKeyResponse);

  // RevokeKey removes an `sk-` credential (by key or key-hash) through the live
  // daemon — the delete forwards to the control-zone leader. Same node-cert gate
  // as MintKey.
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);

  // ListKeys enumerates the credential records from this daemon's LOCAL
  // control-zone replica (a read — no leader round-trip), so `auth list` works
  // on any node without stopping the daemon (offline list is refused on an
  // enrolled joiner). Same node-cert gate as MintKey. Returns hashes + opaque
  // records (hashes are not secrets); the CLI decodes + renders.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);

  // RegisterForeignCa records a cross-org CA anchor (trust_domain + CA cert) in
  // the control zone through the live daemon, so a foreign org's agents become
  // trusted at the mTLS handshake WITHOUT a restart (the apply observer hot-swaps
  // the client-cert verifier). The write forwards to the control-zone leader, so
  // any node serves it. Node-cert gated (a cross-org trust decision is an admin
  // op). `ca_cert_pem` is the org's CA (PEM); `expected_fingerprint` is verified
  // out-of-band against the computed one (anti-swap at the trust-bootstrap
  // moment). CAS: re-registering the same fingerprint is refused.
  rpc RegisterForeignCa(RegisterForeignCaRequest) returns (RegisterForeignCaResponse);

  // UnregisterForeignCa drops a foreign CA anchor by fingerprint (the coarse
  // cross-org revocation: removes trust for the whole org). Same node-cert gate.
  rpc UnregisterForeignCa(UnregisterForeignCaRequest) returns (UnregisterForeignCaResponse);

  // ListForeignCas enumerates registered foreign-CA anchors from this daemon's
  // LOCAL control-zone replica (a read). Same node-cert gate.
  rpc ListForeignCas(ListForeignCasRequest) returns (ListForeignCasResponse);
}

// NodeEnrollmentService is the pre-mTLS BOOTSTRAP plane: the one surface a
// brand-new node reaches BEFORE it owns a cluster cert. It lives apart from
// ZoneApiService on purpose — the data plane is strict mTLS (client cert
// required), which a certless joiner cannot satisfy, so enrollment cannot live
// there. Runs on its own listener; auth is the join token (k3s/kubeadm model),
// integrity is the CA fingerprint pinned inside the token, and the channel is
// carried by the encrypted overlay. Keeping it a dedicated single-RPC service
// is fail-safe: no data-plane method is even registered on the enroll listener,
// so nothing can be reached there without mTLS.
service NodeEnrollmentService {
  // JoinCluster provisions a new node with cluster TLS certificates. The caller
  // authenticates with the join token password (k3s/kubeadm "join" model); the
  // server verifies it, signs a node cert, and returns it with the CA cert. The
  // CA key never leaves the signing node.
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);

  // GetCrl returns the cluster's current CA-signed agent-cert revocation list.
  // Unlike JoinCluster it needs no token: the CRL is a public, CA-signed
  // artifact — its authenticity is the CA signature, its content (revoked
  // serials) is not secret — so any node fetches it here to refresh its
  // revocation view, the same CA plane that hands out the CA itself.
  rpc GetCrl(GetCrlRequest) returns (GetCrlResponse);
}

// === Search Capability Advertisement (Issue #3147) ===

message GetSearchCapabilitiesRequest {
  string zone_id = 1;
}

message SearchCapabilities {
  string zone_id = 1;
  string device_tier = 2;            // "phone", "laptop", "server"
  repeated string search_modes = 3;  // "keyword", "semantic", "hybrid"
  string embedding_model = 4;
  int32 embedding_dimensions = 5;
  bool has_graph = 6;
}

// === Client Messages ===

// ProposeRequest submits a command to be replicated through Raft.
message ProposeRequest {
  RaftCommand command = 1;
  string request_id = 2;
  // Zone ID for multi-zone routing. Required in multi-zone mode.
  string zone_id = 3;
  // Internal forwarding: bincode-serialized Command bytes.
  // When set, the server deserializes directly (skipping proto→internal conversion).
  // Used by ZoneConsensus::propose() leader forwarding — avoids double serialization.
  bytes raw_command = 4;
  // Set by follower when forwarding. Prevents infinite forwarding loops
  // (if leader_hint is stale and target is also a follower).
  bool forwarded = 5;
}

// ProposeResponse is the response to a Propose RPC.
message ProposeResponse {
  bool success = 1;
  optional string error = 2;
  optional string leader_address = 3;
  optional RaftResponse result = 4;
  uint64 applied_index = 5;
}

// QueryRequest reads from the local state machine.
message QueryRequest {
  RaftQuery query = 1;
  bool read_from_leader = 2;
  // Zone ID for multi-zone routing. Required in multi-zone mode.
  string zone_id = 3;
}

// QueryResponse is the response to a Query RPC.
message QueryResponse {
  bool success = 1;
  optional string error = 2;
  optional string leader_address = 3;
  optional RaftQueryResponse result = 4;
}

// GetClusterInfoRequest requests cluster information.
message GetClusterInfoRequest {
  // Zone ID for multi-zone routing. Required in multi-zone mode.
  string zone_id = 1;
}

// GetClusterInfoResponse returns cluster information.
message GetClusterInfoResponse {
  uint64 node_id = 1;
  uint64 leader_id = 2;
  uint64 term = 3;
  ClusterConfig config = 4;
  bool is_leader = 5;
  optional string leader_address = 6;
}

// JoinZoneRequest is sent by a new node to an existing zone member.
// The leader will propose a ConfChange(AddVoter) for the joining node,
// or ConfChange(AddLearnerNode) when as_learner is true.
message JoinZoneRequest {
  // Zone to join.
  string zone_id = 1;
  // The joining node's Raft ID.
  uint64 node_id = 2;
  // The joining node's gRPC address (e.g., "http://10.0.0.3:2126").
  string node_address = 3;
  // When true, leader proposes AddLearnerNode instead of AddNode.
  // Learners receive log replication but do not count toward quorum.
  bool as_learner = 4;
}

// JoinZoneResponse is returned after the ConfChange is committed.
message JoinZoneResponse {
  bool success = 1;
  optional string error = 2;
  // If not leader, redirect to leader.
  optional string leader_address = 3;
  // Current cluster config so the joiner knows all peers.
  optional ClusterConfig config = 4;
}

// DiscoverZonesRequest reads the responder's local federation mount
// configuration.  No fields — the RPC returns whatever mounts the
// responder was configured with at boot.
message DiscoverZonesRequest {}

// DiscoverZonesResponse reports the responder's known federation
// zones with the local mount path each one is exposed at.
message DiscoverZonesResponse {
  repeated FederationZoneInfo zones = 1;
}

// FederationZoneInfo describes one federation zone the responder
// exposes.  Consumed by the boot decision layer on a fresh joiner:
// each entry is dispatched to `bootstrap_or_join_zone` (JoinZone
// RPC + local ConfState install) and the mount path stitches the
// remote zone into the joiner's local root namespace.
message FederationZoneInfo {
  // Zone id — matches the founder's NEXUS_FEDERATION_ZONES entry.
  string zone_id = 1;
  // Global path in the joiner's namespace this zone should be
  // mounted at — matches the founder's NEXUS_FEDERATION_MOUNTS
  // entry (`<path>=<zone_id>`).
  string mount_path = 2;
}

// RemoveVoterRequest asks the leader to prune a stale voter/learner
// from a zone's ConfState.  Mirror of JoinZoneRequest for the reverse
// operation.
message RemoveVoterRequest {
  // Zone whose ConfState is being pruned.
  string zone_id = 1;
  // The node id to remove.  The RPC does NOT check whether the id
  // is currently a voter or learner — raft-rs's `Changer::remove`
  // is idempotent on unknown ids.
  uint64 target_node_id = 2;
}

// RemoveVoterResponse is returned after the ConfChange is committed
// (or rejected).
message RemoveVoterResponse {
  bool success = 1;
  optional string error = 2;
  // If not leader, redirect to leader.
  optional string leader_address = 3;
}

// MintAgentRequest asks the CA holder to sign an agent identity cert.
message MintAgentRequest {
  // Agent name → the cert subject `nexus://agent/{subject_id}`.
  string subject_id = 1;
  // Human-friendly display label (optional).
  string display_name = 2;
  // Rotation escape: re-mint a subject that already holds an active credential.
  bool allow_existing = 3;
}

// MintAgentResponse carries the signed bundle (cert + key + cluster CA), or an
// error (e.g. this node does not hold the CA key, or the name clashes).
message MintAgentResponse {
  bool success = 1;
  optional string error = 2;
  bytes agent_cert_pem = 3;
  bytes agent_key_pem = 4;
  bytes ca_pem = 5;
}

// MintKeyRequest asks the daemon to mint an `sk-` user/service credential.
message MintKeyRequest {
  // "user" or "service" — the sk- token plane (agents use MintAgent instead).
  string subject_type = 1;
  // The principal id bound into the record.
  string subject_id = 2;
  // Zone grants as `zone:perms` (e.g. `sharedzone:rw`); may be empty if admin.
  repeated string zones = 3;
  // Global admin (the only principal allowed a zoneless key).
  bool admin = 4;
  // Optional expiry, milliseconds since epoch (0 = never).
  uint64 expires_at_ms = 5;
  // Human-friendly display label.
  string name = 6;
  // Rotation escape: mint even if the subject already holds an active key.
  bool allow_existing = 7;
}

// MintKeyResponse carries the one-time plaintext key, or an error.
message MintKeyResponse {
  bool success = 1;
  optional string error = 2;
  // The `sk-...` key, shown once. Empty on failure.
  string key = 3;
}

// RevokeKeyRequest removes an sk- credential by its key or key-hash (exactly
// one set).
message RevokeKeyRequest {
  optional string key = 1;
  optional string key_hash = 2;
}

// RevokeKeyResponse reports whether a record was removed.
message RevokeKeyResponse {
  bool success = 1;
  optional string error = 2;
  // True if a record was present and removed; false if there was nothing to
  // revoke (already gone).
  bool removed = 3;
}

// ListKeysRequest enumerates all credential records (no filter). Empty by
// design; a namespace filter can be added later without breaking the wire.
message ListKeysRequest {}

// One credential record: its lookup hash + the opaque serialized record the
// CLI decodes. The hash is not a secret.
message ListedKey {
  string key_hash = 1;
  bytes record = 2;
}

// ListKeysResponse carries the records from the daemon's local replica, or an
// error.
message ListKeysResponse {
  bool success = 1;
  optional string error = 2;
  repeated ListedKey keys = 3;
}

// RegisterForeignCaRequest records a cross-org CA anchor.
message RegisterForeignCaRequest {
  // The foreign org's trust-domain id (e.g. "hospital-a"); the `{td}` in a
  // foreign agent's `from` = `{td}/agent/{name}`.
  string trust_domain_id = 1;
  // The org's CA certificate (PEM).
  bytes ca_cert_pem = 2;
  // The expected `sha256:<hex>` fingerprint, verified out-of-band against the
  // computed one before the anchor is trusted (anti-swap at bootstrap).
  string expected_fingerprint = 3;
}

// RegisterForeignCaResponse reports success or the refusal (bad PEM, fingerprint
// mismatch, already registered).
message RegisterForeignCaResponse {
  bool success = 1;
  optional string error = 2;
  // The computed `sha256:<hex>` fingerprint of the registered anchor.
  string fingerprint = 3;
}

// UnregisterForeignCaRequest drops an anchor by its fingerprint.
message UnregisterForeignCaRequest {
  string fingerprint = 1;
}

// UnregisterForeignCaResponse reports whether an anchor was present + removed.
message UnregisterForeignCaResponse {
  bool success = 1;
  optional string error = 2;
  bool removed = 3;
}

// One registered foreign-CA anchor (fingerprint + trust domain). The CA bytes
// are not returned — the fingerprint identifies it and is safe to display.
message ForeignCaEntry {
  string trust_domain_id = 1;
  string fingerprint = 2;
}

message ListForeignCasRequest {}

// ListForeignCasResponse carries the registered anchors from the local replica.
message ListForeignCasResponse {
  bool success = 1;
  optional string error = 2;
  repeated ForeignCaEntry anchors = 3;
}

// DeleteZoneRequest asks a peer to remove its local zone replica.
message DeleteZoneRequest {
  string zone_id = 1;
  // Reserved for future policy checks. The current maintenance RPC is local
  // and idempotent; high-level mounted-zone safety is enforced by the caller.
  bool force = 2;
}

// DeleteZoneResponse reports local replica deletion.
message DeleteZoneResponse {
  bool success = 1;
  optional string error = 2;
}

// JoinClusterRequest is sent during TLS bootstrap to provision certificates.
// The caller authenticates with a join token password (K3s-style).
// The server signs a node certificate — CA key never leaves the leader.
message JoinClusterRequest {
  // Join token password (64-char hex string).
  string password = 1;
  // The joining node's Raft ID.
  uint64 node_id = 2;
  // The joining node's advertise address (e.g., "http://10.0.0.3:2126").
  string node_address = 3;
  // Zone ID for the node certificate CN (e.g., "root").
  string zone_id = 4;
  // Reserved: was peers_bootstrap (removed — only token-based auth supported).
  reserved 5;
  reserved "peers_bootstrap";
}

// JoinClusterResponse returns cluster TLS material on success.
// The server signs the node cert — CA key never leaves node-1.
message JoinClusterResponse {
  bool success = 1;
  optional string error = 2;
  // Cluster CA certificate (PEM-encoded). Used to verify peer certs.
  bytes ca_pem = 3;
  // Reserved: was ca_key_pem — removed for security (CA key stays on node-1).
  reserved 4;
  reserved "ca_key_pem";
  // Server-signed node certificate (PEM-encoded).
  bytes node_cert_pem = 5;
  // Node private key (PEM-encoded). Generated server-side for the joiner.
  bytes node_key_pem = 6;
  // Cluster API-key HMAC secret (the `sk-` token signing key), served so a
  // joiner inherits it over the SAME token-gated channel as the CA. It must be
  // byte-identical cluster-wide for a minted key to resolve on any node
  // (verification hashes the token with the local secret, then looks the hash
  // up in the replicated store). Absent when the founder runs auth-off — the
  // joiner then stays auth-off too. Persisted joiner-side to `tls/api-key-secret`
  // (the single SSOT), alongside `ca.pem`.
  optional string api_key_secret = 7;
}

// GetCrlRequest is empty — one cluster, one CRL.
message GetCrlRequest {}

// GetCrlResponse carries the current CA-signed CRL (PEM). A node verifies it
// against the CA cert it already holds, then reads the revoked serials.
message GetCrlResponse {
  bytes crl_pem = 1;
}

// === Cluster Configuration ===

// ClusterConfig describes the cluster membership.
message ClusterConfig {
  repeated NodeInfo voters = 1;
  repeated NodeInfo learners = 2;
  repeated NodeInfo witnesses = 3;
}

// NodeInfo describes a node in the cluster.
message NodeInfo {
  uint64 id = 1;
  string address = 2;
  NodeRole role = 3;
}

// === Enums ===

// NodeRole indicates the role of a node.
enum NodeRole {
  ROLE_VOTER = 0;
  ROLE_LEARNER = 1;
  ROLE_WITNESS = 2;
}

// === StepMessage (Raw Raft Message Transport) ===

// StepMessageRequest carries a serialized eraftpb::Message.
// The bytes are opaque to the transport layer.
message StepMessageRequest {
  bytes message = 1;
  // Zone ID for multi-zone routing. Required in multi-zone mode.
  string zone_id = 2;
  // Sender's advertise address (e.g., "http://10.0.0.3:2126").  The
  // receiver updates its transport peer map with
  // `(message.from_id -> sender_address)` so the network is the SSOT
  // for routing — restart, DHCP changes, and post-failover leaders
  // converge naturally as messages arrive.  Optional: empty string
  // is treated as "sender did not advertise" and the receiver falls
  // back to whatever peer-map entry already exists.
  string sender_address = 3;
}

// StepMessageResponse acknowledges receipt.
message StepMessageResponse {
  bool success = 1;
  optional string error = 2;
}

// === EC Replication Messages (Phase C) ===

// ECReplicationEntry is a single entry from the EC replication WAL.
// Sent from the writer node to peers for async replication.
message ECReplicationEntry {
  // Sequence number in the writer's replication log (WriteToken).
  uint64 seq = 1;
  // Serialized Command bytes (same format as Raft log entries).
  bytes command = 2;
  // Wall clock timestamp (Unix seconds) for LWW conflict resolution (Phase D).
  uint64 timestamp = 3;
  // Writer node ID for LWW tie-breaking (Phase D).
  uint64 node_id = 4;
}

// ReplicateEntriesRequest sends a batch of EC entries to a peer.
message ReplicateEntriesRequest {
  // Zone this replication belongs to.
  string zone_id = 1;
  // Batch of EC entries to replicate.
  repeated ECReplicationEntry entries = 2;
  // The sender's node ID.
  uint64 sender_node_id = 3;
}

// ReplicateEntriesResponse acknowledges receipt and application.
message ReplicateEntriesResponse {
  bool success = 1;
  optional string error = 2;
  // Highest sequence number successfully applied by the receiver.
  uint64 applied_up_to = 3;
}

// SnapshotEcStateRequest carries the sender's CURRENT EC state to a lagging
// peer (anti-entropy catch-up). `entries` reuse ECReplicationEntry — each
// `command` is a re-materialized SetMetadata for a currently-live key; their
// per-entry `seq` is not meaningful (the originals were compacted). After
// applying the whole snapshot the receiver sets its acked_seq to
// `covering_seq` (the sender's max applied at snapshot time) and clears
// needs_snapshot, then resumes incremental replication past `covering_seq`.
message SnapshotEcStateRequest {
  string zone_id = 1;
  repeated ECReplicationEntry entries = 2;
  // Seq the receiver is caught up to once this snapshot is applied.
  uint64 covering_seq = 3;
  uint64 sender_node_id = 4;
}

// SnapshotEcStateResponse acknowledges a snapshot transfer.
message SnapshotEcStateResponse {
  bool success = 1;
  optional string error = 2;
  // Echoes covering_seq on success — the seq the receiver is now caught up to.
  uint64 acked_up_to = 3;
}

// === ReadBlob (R20.18.7 — driver-to-driver CAS fetch) ===

// ReadBlobRequest asks a peer for the blob bytes.
//
// Two addressing modes:
//   - `content_hash` set, `path` empty → CAS lookup by hash on the peer's
//     local backends. Used by chunk fetch and CAS-backed federation.
//   - `path` set → drive the peer's VFSRouter at that global path, so PAS
//     mounts (PathLocalBackend, S3Backend, …) can serve cross-node reads.
//     `content_hash` is ignored when `path` is non-empty.
//
// Internal RPC; authentication is the transport's mTLS (client cert signed
// by the cluster CA), so no explicit auth field is carried in the body.
message ReadBlobRequest {
  // Reserved: pre-store-and-forward dual-mode shape (content_hash + path).
  // Removed in favor of a single ``content_id`` so the kernel never has to
  // pick CAS-vs-PAS dispatch — peer self-routes through its own
  // ``VFSRouter`` just like a local ``sys_read``.
  reserved 1, 2;
  reserved "content_hash", "path";

  // Backend-defined opaque content identifier — the same string the peer
  // would have stored in its local ``FileMetadata.content_id`` slot at
  // write time. For federation reads this carries a global VFS path
  // (``/<zone>/<...>``); the peer's ``BlobFetcher::read`` impl drives its
  // local kernel through the standard read path so each backend interprets
  // ``content_id`` in its own way (CAS=hash, PAS=backend_path, etc.).
  // The caller's kernel never inspects this field.
  string content_id = 3;
}

// ReadBlobResponse returns either the blob bytes or a non-empty `error`.
message ReadBlobResponse {
  bytes content = 1;
  string error = 2;
}
