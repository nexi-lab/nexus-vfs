name: Cluster Binary Build (reusable)

on:
  workflow_call:
    inputs:
      upload_retention_days:
        description: Artifact retention in days
        required: false
        type: number
        default: 14

jobs:
  build:
    name: cluster-binary / ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Every `max_size_bytes` below is a measurement against the compiler
      # pinned in `rust-toolchain.toml`, not a property of the source. Before the
      # pin, `stable` resolved differently per runner inside a single run, so
      # these numbers decided merges by coin flip.
      #
      # These measurements include the confined user runtime on 1.99.0, after
      # separating local routes from the remote gateway client. Same-toolchain
      # before/after measurements and source revisions live in
      # rust/profiles/README.md; unused gateway code is excluded before budgeting.
      #
      # Headroom is ~3% deliberately. The linux cap previously passed with 0.22%
      # slack, which is how a compiler change could flip a green PR into a red
      # main: a budget that tight asserts the toolchain, not the code.
      #
      # Bump the pin and re-measure these in the same commit, never one without
      # the other. `rust-toolchain.toml` is in this workflow's paths filter so
      # that a pin-only change cannot skip the check.
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: nexusd-cluster-linux-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            operator_binary: nexus-agent-enroll
            operator_artifact_name: nexus-agent-enroll-linux-x86_64-operator-agent-enrollment
            max_size_bytes: 20764672  # 19.8 MiB. Measured 20,202,880 on the
                                      # rebased #364 (main's 1.99.0 baseline 19,515,016
                                      # plus the typed ZoneRuntime plane and the declared
                                      # mount subtree); ~2.8% headroom.
          - os: macos-14
            artifact_name: nexusd-cluster-macos-arm64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            operator_binary: nexus-agent-enroll
            operator_artifact_name: nexus-agent-enroll-macos-arm64-operator-agent-enrollment
            max_size_bytes: 18087936  # 17.25 MiB. Measured 17,419,600 on the
                                      # rebased #364 (main's 1.99.0 baseline 16,804,432
                                      # plus the #364/#361 stack); ~3.8% headroom.
          - os: macos-14
            artifact_name: nexusd-cluster-macos-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            operator_binary: nexus-agent-enroll
            operator_artifact_name: nexus-agent-enroll-macos-x86_64-operator-agent-enrollment
            target: x86_64-apple-darwin
            max_size_bytes: 19148800  # 18.25 MiB. Measured 18,580,176 on the
                                      # rebased #364 (main's 1.99.0 baseline 17,947,120
                                      # plus the #364/#361 stack); ~3.1% headroom.
          - os: windows-latest
            artifact_name: nexusd-cluster-windows-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster.exe
            operator_binary: nexus-agent-enroll.exe
            operator_artifact_name: nexus-agent-enroll-windows-x86_64-operator-agent-enrollment
            max_size_bytes: 19922944  # 19 MiB. Measured 19,324,416 on the
                                      # rebased #364 (main's 1.99.0 baseline 18,572,288
                                      # plus the #364/#361 stack); ~3.1% headroom.


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-protoc

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cluster-binary-${{ matrix.os }}-${{ matrix.target || 'native' }}

      # A build that enables extra Cargo features produces a DIFFERENT binary,
      # and consumers pin these by version. Two binaries carrying one version
      # and one name is a mis-deploy that surfaces downstream as "mount driver
      # not found" — a symptom that points nowhere near the version. So the
      # feature set has to be visible in the artifact name, and this refuses
      # the build rather than trusting whoever adds the next matrix row to
      # remember.
      - name: Feature-carrying builds must say so in their name
        if: matrix.features != ''
        shell: bash
        run: |
          set -euo pipefail
          for f in $(echo "${{ matrix.features }}" | tr ',' ' '); do
            if [[ "${{ matrix.artifact_name }}" != *"$f"* ]]; then
              echo "::error::artifact_name '${{ matrix.artifact_name }}' does not name the feature '$f' it is built with."
              echo "A feature build is a different binary. Name it so, e.g. nexusd-cluster-<platform>-$f."
              exit 1
            fi
          done
          echo "artifact name carries its features: ${{ matrix.features }}"

      - name: Prepare native enrollment fixture
        if: matrix.artifact_name == 'nexusd-cluster-linux-x86_64'
        run: python3 scripts/e2e/cluster_binary_enrollment.py prepare --output "$RUNNER_TEMP/release-enrollment"

      - name: Build release binary
        run: cargo build --release -p ${{ matrix.package }} --bin ${{ matrix.bin }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Qualify the optimized binary before publication
        if: matrix.artifact_name == 'nexusd-cluster-linux-x86_64'
        run: python3 scripts/e2e/cluster_binary_enrollment.py run --binary target/release/nexusd-cluster --output "$RUNNER_TEMP/release-enrollment"

      - name: Retain native enrollment evidence
        if: always() && matrix.artifact_name == 'nexusd-cluster-linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: release-enrollment
          path: ${{ runner.temp }}/release-enrollment
          if-no-files-found: error

      - name: Build the separate operator client
        run: cargo build --release -p nexus-cluster --bin nexus-agent-enroll --features operator-agent-enrollment ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Check daemon and operator client sizes
        shell: bash
        env:
          MAX_SIZE_BYTES: ${{ matrix.max_size_bytes }}
          BINARY_PATH: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.binary }}
          OPERATOR_PATH: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.operator_binary }}
          OPERATOR_ARTIFACT: ${{ matrix.operator_artifact_name }}
        run: |
          set -euo pipefail
          for candidate in "$BINARY_PATH" "$OPERATOR_PATH"; do
            artifact="${{ matrix.artifact_name }}"
            if [ "$candidate" = "$OPERATOR_PATH" ]; then
              artifact="$OPERATOR_ARTIFACT"
            fi
            if [ "$RUNNER_OS" = "macOS" ]; then
              actual=$(stat -f '%z' "$candidate")
            else
              actual=$(stat -c '%s' "$candidate")
            fi
            echo "$artifact binary size: $actual bytes (max: $MAX_SIZE_BYTES)"
            if [ "$actual" -gt "$MAX_SIZE_BYTES" ]; then
              echo "::error::$artifact exceeds its size budget ($actual > $MAX_SIZE_BYTES bytes)"
              exit 1
            fi
          done

      - name: Sanity-check --help
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          target/release/${{ matrix.binary }} --help
          target/release/${{ matrix.operator_binary }} --help

      - uses: actions/setup-node@v4
        if: ${{ !matrix.target }}
        with:
          node-version: '22'

      - name: Install the native client
        if: ${{ !matrix.target }}
        working-directory: clients/node
        run: npm ci

      - name: Verify local mount storage and cold restart
        if: ${{ !matrix.target }}
        working-directory: clients/node
        env:
          NEXUS_LOCAL_MOUNT_BINARY: ${{ github.workspace }}/target/release/${{ matrix.binary }}
        run: node --test test/local-mount.test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: ${{ inputs.upload_retention_days }}

      # This feature-carrying client is a separate executable, never a different
      # daemon hidden behind the same version/name. Reuse the same native runner
      # and unchanged per-platform size cap; no extra platform job is needed.
      - name: Upload the operator-only client
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.operator_artifact_name }}
          path: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.operator_binary }}
          if-no-files-found: error
          retention-days: ${{ inputs.upload_retention_days }}
