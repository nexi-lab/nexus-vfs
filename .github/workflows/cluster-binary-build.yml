name: Cluster Binary Build (reusable)

on:
  workflow_call:
    inputs:
      upload_retention_days:
        description: Artifact retention in days
        required: false
        type: number
        default: 14

jobs:
  build:
    name: cluster-binary / ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Every `max_size_bytes` below is a measurement against the compiler
      # pinned in `rust-toolchain.toml`, not a property of the source. Before the
      # pin, `stable` resolved differently per runner inside a single run, so
      # these numbers decided merges by coin flip.
      #
      # The whole set was re-measured on 1.99.0, which grew EVERY target with no
      # source change: linux +778 KB, macos-arm64 +750 KB, macos-x86_64 +567 KB,
      # windows +1,017 KB. The per-feature history each number used to carry is
      # therefore superseded — attributing any of it to a feature now would be
      # wrong — so each entry records its measurement and its headroom instead.
      #
      # Headroom is ~3% deliberately. The linux cap previously passed with 0.22%
      # slack, which is how a compiler change could flip a green PR into a red
      # main: a budget that tight asserts the toolchain, not the code.
      #
      # Bump the pin and re-measure these in the same commit, never one without
      # the other. `rust-toolchain.toml` is in this workflow's paths filter so
      # that a pin-only change cannot skip the check.
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: nexusd-cluster-linux-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            max_size_bytes: 20447232  # 19.5 MiB — the 1.99.0 toolchain baseline
                                      # (#390 measured 18,866,640 on main) plus the
                                      # typed ZoneRuntime plane (#364) and the
                                      # declared mount subtree (#361) stacked on top
                                      # (~0.75 MiB combined on the older toolchain);
                                      # generous until re-measured on the merge.
          - os: macos-14
            artifact_name: nexusd-cluster-macos-arm64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            max_size_bytes: 17301504  # 16.5 MiB — the 1.99.0 toolchain baseline
                                      # (#390 measured 16,216,880 on main) plus the
                                      # #364/#361 stack (~0.25 MiB on the older
                                      # toolchain); generous until re-measured.
          - os: macos-14
            artifact_name: nexusd-cluster-macos-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster
            target: x86_64-apple-darwin
            max_size_bytes: 18350080  # 17.5 MiB — the 1.99.0 toolchain baseline
                                      # (#390 measured 17,344,272 on main) plus the
                                      # #364/#361 stack (~0.5 MiB on the older
                                      # toolchain); generous until re-measured.
          - os: windows-latest
            artifact_name: nexusd-cluster-windows-x86_64
            package: nexus-cluster
            bin: nexusd-cluster
            binary: nexusd-cluster.exe
            max_size_bytes: 19398656  # 18.5 MiB — the 1.99.0 toolchain baseline
                                      # (#390 measured 18,056,192 on main) plus the
                                      # #364/#361 stack (~0.5 MiB on the older
                                      # toolchain); generous until re-measured.


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PROTOC_VERSION=3.20.2
          case "$(uname -m)" in
            arm64) ARCH=aarch_64 ;;
            x86_64) ARCH=x86_64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/protoc"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-${ARCH}.zip"
          unzip -o /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/protoc/bin/protoc" --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '3.20.2'
          $protocDir = Join-Path $env:USERPROFILE 'protoc'
          New-Item -ItemType Directory -Force -Path $protocDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest -UseBasicParsing -Uri `
            "https://github.com/protocolbuffers/protobuf/releases/download/v${protocVersion}/protoc-${protocVersion}-win64.zip" `
            -OutFile $zipPath
          Expand-Archive -Force -Path $zipPath -DestinationPath $protocDir
          $protocBinDir = Join-Path $protocDir 'bin'
          $protocExe = Join-Path $protocBinDir 'protoc.exe'
          Add-Content -Path $env:GITHUB_PATH -Value $protocBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$protocExe"
          & $protocExe --version

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cluster-binary-${{ matrix.os }}-${{ matrix.target || 'native' }}

      # A build that enables extra Cargo features produces a DIFFERENT binary,
      # and consumers pin these by version. Two binaries carrying one version
      # and one name is a mis-deploy that surfaces downstream as "mount driver
      # not found" — a symptom that points nowhere near the version. So the
      # feature set has to be visible in the artifact name, and this refuses
      # the build rather than trusting whoever adds the next matrix row to
      # remember.
      - name: Feature-carrying builds must say so in their name
        if: matrix.features != ''
        shell: bash
        run: |
          set -euo pipefail
          for f in $(echo "${{ matrix.features }}" | tr ',' ' '); do
            if [[ "${{ matrix.artifact_name }}" != *"$f"* ]]; then
              echo "::error::artifact_name '${{ matrix.artifact_name }}' does not name the feature '$f' it is built with."
              echo "A feature build is a different binary. Name it so, e.g. nexusd-cluster-<platform>-$f."
              exit 1
            fi
          done
          echo "artifact name carries its features: ${{ matrix.features }}"

      - name: Build release binary
        run: cargo build --release -p ${{ matrix.package }} --bin ${{ matrix.bin }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Check binary size
        shell: bash
        env:
          MAX_SIZE_BYTES: ${{ matrix.max_size_bytes }}
          BINARY_PATH: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            actual=$(stat -f '%z' "$BINARY_PATH")
          else
            actual=$(stat -c '%s' "$BINARY_PATH")
          fi
          echo "Binary size: $actual bytes (max: $MAX_SIZE_BYTES)"
          if [ "$actual" -gt "$MAX_SIZE_BYTES" ]; then
            echo "::error::${{ matrix.artifact_name }} exceeds its size budget ($actual > $MAX_SIZE_BYTES bytes)"
            exit 1
          fi

      - name: Sanity-check --help
        if: ${{ !matrix.target }}
        shell: bash
        run: target/release/${{ matrix.binary }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: ${{ inputs.upload_retention_days }}
