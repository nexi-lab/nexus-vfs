name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check-ubuntu-22.04
      - run: cargo check --workspace

  test:
    name: cargo test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test-ubuntu-22.04
      # --all-features: the connector drivers (driver-anthropic, driver-openai,
      # driver-s3, ...) are feature-gated off by default, so a plain
      # `--workspace` never compiles them and never runs their tests. They were
      # invisible to CI until this line.
      - run: cargo test --workspace --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-ubuntu-22.04
      # --all-targets lints tests, benches and examples, not just lib/bin.
      # Without it a lint in test code lands on main unseen — which is exactly
      # how the doc-lint fixed alongside this change got in.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all -- --check

  node-client:
    name: node client
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check owner schema projections
        working-directory: contracts/zone-path
        run: npm ci --ignore-scripts && npm test
      - name: Install
        working-directory: clients/node
        run: npm ci
      - name: Guard the packaged proto against drift
        working-directory: clients/node
        # Fails when the copy shipped in the package is not byte-identical to
        # proto/nexus/grpc/vfs/vfs.proto, which is the whole point of the package.
        run: npm run build && npm run check-proto
      - name: Test
        working-directory: clients/node
        # Includes no-disk-proto.test.mjs, which catches the client reaching for
        # the filesystem — a break that only shows up in a consumer's bundle.
        run: npm test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch a released nexusd
        shell: bash
        # The client's hardest failures only appear against a real server:
        # a definition can be well formed, round-trip offline, and still move
        # nothing on the wire. nexusd needs no credentials — serve-local binds
        # loopback with TLS off — so CI can run one.
        run: |
          set -euo pipefail
          base='https://sudowork-runtime-1309794936.cos.accelerate.myqcloud.com/nexus-vfs/release/latest'
          tarball='nexusd-cluster-linux-x86_64.tar.gz'
          curl -fsSL --retry 3 "$base/$tarball" -o "$tarball"
          curl -fsSL --retry 3 "$base/SHA256SUMS.txt" -o SHA256SUMS.txt
          grep " $tarball\$" SHA256SUMS.txt | sha256sum -c -
          tar xzf "$tarball"
          install -m 0755 nexusd-cluster-linux-x86_64/nexusd-cluster ./nexusd
          ./nexusd --version

      - name: Start nexusd
        shell: bash
        run: |
          set -euo pipefail
          ./nexusd serve-local --port 22126 --data-dir "$RUNNER_TEMP/nexus-data" --no-tls > nexusd.log 2>&1 &
          for _ in $(seq 1 60); do
            if node -e "require('net').connect(22126,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "nexusd is listening"
              exit 0
            fi
            sleep 1
          done
          echo '::error::nexusd did not start'; cat nexusd.log; exit 1

      - name: Live round-trip
        working-directory: clients/node
        env:
          NEXUS_VFS_ENDPOINT: 127.0.0.1:22126
        run: npm run test:live

      - name: Live round-trip, bundled
        working-directory: clients/node
        env:
          NEXUS_VFS_ENDPOINT: 127.0.0.1:22126
        # Bundled with bun, the way a consumer ships: a bundler can break what
        # a plain `node` run resolves fine, and that has happened here before.
        run: |
          set -euo pipefail
          bun build ./test/live-entry.mjs --outfile="$RUNNER_TEMP/live-bundled.mjs" --target=node --format=esm
          node "$RUNNER_TEMP/live-bundled.mjs"

      - name: Start an auth-on cluster
        shell: bash
        # `serve-local --no-tls` cannot reach the zone-api plane: those RPCs
        # authenticate the caller by its certificate, so without mTLS there is
        # no caller to gate. A founder cluster issues its own CA and node cert
        # on first boot, which is all the gate test needs.
        run: |
          set -euo pipefail
          ./nexusd --cluster-init citest \
            --hostname ci-founder \
            --advertise-addr 127.0.0.1:22127 \
            --data-dir "$RUNNER_TEMP/zone-data" \
            --identity-dir "$RUNNER_TEMP/zone-identity" > zoned.log 2>&1 &
          for _ in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/zone-data/tls/node.pem" ] && [ -s "$RUNNER_TEMP/zone-data/tls/ca.pem" ] \
              && node -e "require('net').connect(22127,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "cluster issued its own credentials and is listening"
              exit 0
            fi
            sleep 1
          done
          echo '::error::the founder cluster never issued credentials'; cat zoned.log; exit 1

      - name: Session-mint gate
        working-directory: clients/node
        env:
          NEXUS_ZONE_API_ENDPOINT: 127.0.0.1:22127
        run: |
          set -euo pipefail
          NEXUS_ZONE_API_TLS_DIR="$RUNNER_TEMP/zone-data/tls" npm run test:zone-api-live

      - name: nexusd log on failure
        if: failure()
        run: |
          tail -50 nexusd.log || true
          tail -50 zoned.log || true
