[package]
name = "nexus-plugin-abi"
version = "0.1.0"
edition = "2021"
description = "Stable C ABI contract between the Nexus kernel and dynamically-loaded plugins (.so/.dylib)"

[lib]
name = "nexus_plugin_abi"
crate-type = ["rlib"]

[features]
# Optional adapter for plugins implemented with tonic. The C contract and
# kernel loader keep a dependency-free default build.
tonic = ["dep:tonic", "dep:http"]

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["codegen"], optional = true }
http = { version = "1", optional = true }
