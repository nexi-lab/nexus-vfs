[package]
name = "lib"
version = "0.1.0"
edition = "2021"
description = "Shared Rust utilities — bloom, hash, search, trigram, ReBAC, path/prefix/simd/io/glob (WASM/edge compatible by default). Linux libc analogue per KERNEL-ARCHITECTURE.html §6."

[lib]
name = "lib"
crate-type = ["rlib"]

[features]
# Brings `lib::transport_primitives` (TLS, pool, addressing, TOFU trust
# store, PeerBlobClient trait). Enabled by every peer crate that speaks
# raft or VFS gRPC. WASM / pure-algo callers skip it.
transport = [
    "dep:tonic",
    "dep:tokio",
    "dep:dashmap",
    "dep:parking_lot",
    "dep:thiserror",
    "dep:tracing",
    "dep:sha2",
    "dep:pem",
    "dep:base64",
    "dep:time",
    "dep:rustls",
    "dep:ring",
    "dep:x509-parser",
    "dep:tokio-rustls",
    "dep:tokio-stream",
    "dep:arc-swap",
]

# `lib::rt` — the sync→async runtime bridge (block_on_via / block_on_portable),
# the ONE home for the "block_in_place needs a multi-thread runtime" hazard.
# Lighter than `transport`: only tokio's rt + rt-multi-thread, no tonic/rustls.
runtime-bridge = ["dep:tokio", "tokio/rt", "tokio/rt-multi-thread"]

[dependencies]
# Constants SSOT — pulled unconditionally because the crate is
# zero-dep-cost (only `pub const` definitions). transport_primitives
# uses it for the gRPC server-hardening defaults; other modules may
# reach for it as the constants set grows.
contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ahash = { workspace = true }
regex = { workspace = true }
memchr = { workspace = true }
roaring = { workspace = true }  # used by lib::bitmap pure-Rust helpers
globset = { workspace = true }
blake3 = { workspace = true }
string-interner = { workspace = true }
regex-syntax = { workspace = true }
crc32fast = { workspace = true }

# Transport-primitives module deps (gated by the `transport` feature).
tonic = { workspace = true, optional = true }
# Pin the process-level rustls crypto provider explicitly (ring, matching
# tonic's `tls-ring`). rustls 0.23's auto-selecting config builder panics
# when zero OR multiple provider features are compiled in, and on Linux the
# graph pulls both `ring` and `aws-lc-rs` (rustls' default). `ring` here is
# only for `install_default`; see `transport_primitives::ensure_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time"], optional = true }
# The mTLS acceptor for the federated cross-org trust plane (matches tonic's own
# `tls-ring` tokio-rustls so its `Connected for TlsStream` bridge — which
# populates `TlsConnectInfo::peer_certs()` — applies to our accepted streams).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
# `ReceiverStream` adapts the accept loop into the `impl Stream` tonic's
# `serve_with_incoming` consumes.
tokio-stream = { version = "0.1", optional = true }
# Atomic hot-swap of the client-cert trust roots when a foreign CA is
# registered / revoked, with no rebuild of the running server.
arc-swap = { version = "1.9", optional = true }
dashmap = { version = "6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
sha2 = { version = "0.11", optional = true }
pem = { version = "3", optional = true }
base64 = { version = "0.22", optional = true }
time = { version = "0.3", features = ["parsing", "formatting"], optional = true }
# EC P-256 message sign/verify + cert parsing for `authorship` (the signed
# `from`). `ring` matches the pinned rustls crypto provider.
ring = { version = "0.17", optional = true }
# `verify` for `authorship::verify` (X509Certificate::verify_signature). Declared
# explicitly, NOT relied on from workspace feature unification, so an external
# consumer (e.g. the nexus repo pinning this crate) gets it too.
x509-parser = { version = "0.18", features = ["verify"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
# transport_primitives unit tests need self-signed cert generation +
# tempdirs. Only compiled when running tests with `--features transport`.
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
