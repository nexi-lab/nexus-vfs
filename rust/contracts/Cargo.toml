[package]
name = "contracts"
version = "0.1.0"
edition = "2021"
description = "Shared Rust traits and types — MutationObserver, FileEvent, MetaStore"

[lib]
name = "contracts"
crate-type = ["rlib"]

[dependencies]
# Serialization for shared state types (lock_state snapshots travel through
# raft-rs's bincode pipeline).
serde = { version = "1.0", features = ["derive"] }
# Used by the owner-side contractgen binary and fixture-backed contract tests.
# Keeping contractgen in this crate deliberately means this is now also a
# normal dependency; the principal consumers already depend on serde_json.
serde_json = "1.0"
# Mutex type used in the ``Locks::shared_state_arc`` trait method. Both
# kernel and raft already use ``parking_lot::Mutex<LockState>`` to wrap
# the SSOT; expressing that in the trait signature keeps install-time
# wiring type-safe (no caller-side mismatch between backend Arc and
# state Arc).
parking_lot = "0.12"

[build-dependencies]
serde_json = "1.0"

[[bin]]
name = "contractgen"
path = "src/bin/contractgen.rs"
