[package]
name = "nexus-cluster"
version = "0.1.1"
edition = "2021"
description = "Nexus cluster-profile runtime — pure Rust binary for Raft + IPC + federation"
authors = ["Nexus Team"]
publish = false

[lib]
name = "nexus_cluster"
path = "src/lib.rs"

[[bin]]
name = "nexusd-cluster"
path = "src/main.rs"

[features]
default = []
rebac = ["dep:nexus-rebac"]
http-api = ["rebac", "dep:nexus-http-api", "nexus-http-api/rebac", "nexus-search-common/transport"]

# Model egress through the VFS: mount an LLM connector, and a model call
# becomes a write that crosses `Kernel::apply_mutating_write_hooks` — the one
# seam every write syscall funnels through — instead of leaving the process as
# outbound HTTP no hook can see.
#
# OFF by default, and the reason is measured rather than assumed. These
# connectors speak HTTP, so they pull reqwest and the client side of hyper:
# the slim binary goes from 16,474,112 to 17,897,984 bytes on the size-gated
# Windows build, **+1.36 MiB** (both measured at this commit — main moves, so
# a pair from two different commits is not a delta). Roughly 700 KiB of that is existing crates
# (hyper, h2, hyper-util) growing as reqwest instantiates client paths that
# were never compiled before, ~280 KiB is genuinely new code, and ~380 KiB is
# the Unicode tables `url` -> `idna` -> ICU4X brings for hostname parsing.
#
# It was +2.75 MiB until reqwest stopped bundling its own crypto provider
# beside the `ring` this binary already links; that half is gone and is not
# coming back, so do not re-measure it from the old figure.
#
# What remains is the same "connector HTTP stack" the backends dep above drops
# on purpose to hold the sudowork target size, so switching it on for every
# deployment to serve the ones that mount a model would be the wrong default.
#
# A tier that wants model calls inside the hook seam builds
# `--features driver-ai`, exactly as an S3-serving tier builds
# `--features driver-s3`.
# `llm-mount` comes with it, not separately: the connectors are what a model
# call goes THROUGH, and this is what makes one happen. Compiling the drivers
# without the driver would leave a mount that accepts a request and never
# answers — the state this tree was already in, and the one the feature exists
# to end.
driver-ai = [
    "backends/driver-anthropic",
    "backends/driver-openai",
    "dep:llm-mount",
]

# Egress content gate: classify what a write is about to put on an egress
# plane (the A2A transcript) and redact or refuse it, on the same
# `apply_mutating_write_hooks` seam the `from`-stamp already uses.
#
# OFF by default, and not because of size — the in-tree detector is a few
# hundred lines of checksum arithmetic with no new transitive deps. It is
# off because arming it CHANGES WRITES: a daemon that has no egress promise
# to keep would start rewriting or refusing A2A messages on a policy nobody
# at that deployment chose. Which content may leave a node is a deployment
# decision, so it is opt-in per build, the way `driver-s3` is.
#
# A build that turns it on gets the deterministic PRC-identifier rules and
# the default posture (redact what is provable, refuse what cannot be
# sanitised, refuse if the detector fails). A deployment that needs a
# different detector or posture calls `egress_gate::service_decl` from its
# own composition instead of taking `default_service_decls` unmodified.
egress-gate = ["dep:egress-gate"]
# The gate with contextual detection: a local Presidio analyzer (named by
# `NEXUS_EGRESS_GATE_PRESIDIO_URL`, loopback only) runs alongside the
# deterministic rules. Adds one small dependency (`httparse`, already in this
# binary through hyper); the analyzer itself is a separate local service.
egress-gate-presidio = ["egress-gate", "egress-gate/presidio"]

[dependencies]
serde_json = { workspace = true }
nexus-rebac = { path = "../../rebac", optional = true }
nexus-http-api = { path = "../../http-api", optional = true }
nexus-search-common = { path = "../../search-common" }
# raft owns federation orchestration (ZoneManager, bootstrap_tls, etc.).
# Only the grpc feature — that is all this binary needs and dropping the
# others keeps the stripped binary small.
raft = { workspace = true, default-features = false, features = ["grpc"] }
# Workspace contracts (ROOT_ZONE_ID, etc.)
contracts = { workspace = true }
# Kernel + the slimmest possible backends slice.  Cluster binary mounts
# host-fs via PathLocalBackend at boot; nothing else compiled in.
# `default-features = false` drops every other driver and the connector
# HTTP stack so the binary stays at the sudowork target size.
kernel = { workspace = true }
backends = { workspace = true, default-features = false, features = ["driver-path-local", "driver-remote"] }
# Drives an LLM mount (see `driver-ai`). Optional so a default build neither
# compiles it nor registers its hook.
llm-mount = { workspace = true, optional = true }
# VFS gRPC server (port 2028) + auth provider (NoAuth — mTLS is the
# cluster-internal authentication boundary). Cluster binary never pulls
# the services post-syscall-hooks tier — keep the dep set minimal.
transport = { workspace = true }

# The `sk-` credential policy. NOT optional and NOT feature-gated: whether a
# deployment authenticates its callers is a RUNTIME decision (see
# `auth_posture.rs`), not a build-time one. Nobody ships a different sshd for a
# trusted network — they configure it. Costs 134 KiB (0.9%) in the binary and
# nothing at runtime when the posture is Open.
auth = { workspace = true }
# A2A messaging substrate — the mailbox `from`-stamp hook, armed at boot
# by `install_a2a_stamp_hook` (first boot-enlisted service; behaviour-
# preserving under NoAuth). The cross-machine stream-wakeup observer is a
# generic raft primitive this binary arms per-zone directly via
# `nexus_raft::stream_wakeup` — a2a itself carries no raft dep.
a2a = { workspace = true }
# Egress content gate (see the `egress-gate` feature). Optional so a
# default build neither compiles it nor registers its hook, and writes on
# this daemon are byte-identical to before.
egress-gate = { workspace = true, optional = true }
# Managed-agent control plane — ManagedAgentService (spawn/get/cancel) +
# proc_entry / workspace-boundary hooks, brought up as a boot service so the
# production `nexusd-cluster` carries the agent control plane directly (one
# production binary, no separate assembly). The subprocess host exposes the
# shared session mailbox; its stdio stays internal. Sudocode's nexusd-cohost
# injects the in-process provider without creating a kernel dependency cycle.
managed-agent = { workspace = true, features = ["subprocess-host"] }
# `auth mint` generates the key_id; the daemon carries no uuid dep.
rand = "0.10"

tonic = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Non-blocking log writer: a dedicated thread owns stdout so high-frequency
# logging can never block tokio worker threads (which would starve the gRPC
# server's accept/handshake path on the shared runtime).
tracing-appender = "0.2"
gethostname = "1.1"

[dev-dependencies]
prost = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
nexus-rebac = { path = "../../rebac" }
tokio-stream = { version = "0.1", features = ["net"] }
nexus-plugin-abi = { workspace = true }
nexus-search-plugin = { path = "../../search-plugin", default-features = false }
nexus-search-common = { path = "../../search-common" }
ed25519-dalek = "2"
base64 = "0.22"
axum = "0.8"
# wire_durable_metastore tests open real redb files in a temp data dir.
tempfile = "3"
# The remote agent-mint gate test parses minted cert PEM to DER to feed
# `peer_identity::from_der`. Test-only, so the shipped binary carries no pem dep.
pem = "3"
# The `mailbox_cli` example seals / opens signed envelopes and names the
# cluster server-name — both live in `lib::transport_primitives` behind its
# `transport` feature. Example-only, so the shipped binary carries no direct
# lib dep beyond what `transport` already pulls.
lib = { workspace = true, features = ["transport"] }

[lints]
workspace = true
