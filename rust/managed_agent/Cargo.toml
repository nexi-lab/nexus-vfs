[package]
name = "managed-agent"
version = "0.1.0"
edition = "2021"
description = "Managed-agent control plane — ManagedAgentService (spawn/get/cancel), the SpawnTask DI seam, proc_entry + workspace-boundary hooks. Kernel-tier: knows only the SpawnTask trait, never an agent runtime."
authors = ["Nexus Team"]
publish = false

[lib]
name = "managed_agent"
path = "src/lib.rs"

[features]
default = []
# Host a subprocess and translate its private ACP stdio into session envelopes.
# In-process hosts implement the same mailbox contract through SpawnTask.
subprocess-host = ["dep:subprocess"]

[dependencies]
kernel = { workspace = true }
contracts = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = "6.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# raw_spawn's SpawnHandle holds a parking_lot::Mutex over the cancel channel
# (sync lock in an async supervisor).
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
subprocess = { path = "../subprocess", optional = true }
# Shared authenticated conversation framing and presence provisioning.
a2a = { workspace = true }

[lints]
workspace = true
