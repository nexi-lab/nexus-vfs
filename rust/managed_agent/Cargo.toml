[package]
name = "managed-agent"
version = "0.1.0"
edition = "2021"
description = "Managed-agent control plane — ManagedAgentService (spawn/get/cancel), the SpawnTask DI seam, proc_entry + workspace-boundary hooks. Kernel-tier: knows only the SpawnTask trait, never an agent runtime."
authors = ["Nexus Team"]
publish = false

[lib]
name = "managed_agent"
path = "src/lib.rs"

[features]
default = []
# The raw ACP-subprocess control-plane spawner (raw_spawn.rs) — spawn an
# external agent binary (scode / claude / codex) and tunnel its stdio over
# node-local DT_STREAMs. Unix-only at the mod gate; pulls the shared
# `subprocess` substrate. In-process co-host (SpawnTask<Kernel>) is a
# separate DI seam wired at the binary edge, NOT a feature here.
subprocess-host = ["dep:subprocess"]

[dependencies]
kernel = { workspace = true }
contracts = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = "6.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# raw_spawn's SpawnHandle holds a parking_lot::Mutex over the cancel channel
# (sync lock in an async supervisor). Unix-only path (subprocess-host).
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
subprocess = { path = "../subprocess", optional = true }
# a2a owns the mailbox contract (envelope schema + `ensure_mailbox_stream`, the
# SSOT for provisioning a `chat-with-me` DT_STREAM). managed_agent is the
# lifecycle owner that CALLS it to provision the per-pid pipe and the persistent
# `/agents/{name}` inbox. No cycle: a2a depends only on kernel + contracts.
a2a = { workspace = true }
