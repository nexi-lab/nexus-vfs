[package]
name = "subprocess"
version = "0.1.0"
edition = "2021"
description = "Hosted-subprocess substrate — spawn an argv child and surface its stdio to the VFS. The ACP one-shot path and the managed-agent raw control-plane path both build on it."
authors = ["Nexus Team"]
publish = false

[lib]
name = "subprocess"
path = "src/lib.rs"

[dependencies]
# tokio drives the child + its async stdio. The portable path (spawn_no_pipes
# + take_stdio_for_connection) is what the managed-agent tunnel pumps into
# memory DT_STREAMs; cross-platform.
kernel = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }

# libc::dup is used ONLY by the unix raw-fd DT_PIPE path (spawn_from_argv →
# the kernel's #[cfg(unix)] stdio-pipe backend). Not needed on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
